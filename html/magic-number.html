<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Number Wizard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #1e0533 0%, #110a1f 50%, #0a0118 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        /* Animated stars background */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .container {
            background: rgba(30, 5, 51, 0.8);
            border: 3px solid #8b5cf6;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 0 40px rgba(139, 92, 246, 0.5), 
                        inset 0 0 20px rgba(139, 92, 246, 0.1);
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 1;
        }

        .wizard-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .wizard-icon {
            font-size: 80px;
            margin-bottom: 10px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 2.5em;
            color: #c4b5fd;
            text-shadow: 0 0 20px rgba(196, 181, 253, 0.8);
            margin-bottom: 10px;
        }

        .subtitle {
            color: #a78bfa;
            font-style: italic;
            font-size: 1.1em;
        }

        .input-section {
            margin: 30px 0;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: 1.2em;
            color: #c4b5fd;
            text-align: center;
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .magic-input {
            width: 100%;
            padding: 15px;
            font-size: 1.3em;
            border: 2px solid #8b5cf6;
            border-radius: 10px;
            background: rgba(17, 10, 31, 0.8);
            color: #fff;
            text-align: center;
            transition: all 0.3s ease;
        }

        .magic-input:focus {
            outline: none;
            border-color: #c4b5fd;
            box-shadow: 0 0 20px rgba(196, 181, 253, 0.5);
        }

        button {
            width: 100%;
            padding: 15px;
            font-size: 1.3em;
            font-weight: bold;
            background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(139, 92, 246, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
            color: #a78bfa;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid rgba(139, 92, 246, 0.3);
            border-top: 4px solid #8b5cf6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result {
            display: none;
            margin-top: 30px;
            padding: 25px;
            background: rgba(17, 10, 31, 0.8);
            border: 2px solid #8b5cf6;
            border-radius: 15px;
            animation: fadeIn 0.5s ease;
        }

        .result.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-title {
            font-size: 1.5em;
            color: #c4b5fd;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 0 10px rgba(196, 181, 253, 0.5);
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            margin: 10px 0;
            background: rgba(139, 92, 246, 0.1);
            border-radius: 8px;
            border-left: 4px solid #8b5cf6;
        }

        .result-label {
            color: #a78bfa;
            font-weight: bold;
        }

        .result-value {
            color: #c4b5fd;
            font-size: 1.1em;
        }

        .message {
            margin-top: 15px;
            padding: 15px;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.2) 0%, rgba(109, 40, 217, 0.2) 100%);
            border-radius: 10px;
            text-align: center;
            color: #e9d5ff;
            font-style: italic;
        }

        .error {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: rgba(220, 38, 38, 0.2);
            border: 2px solid #dc2626;
            border-radius: 10px;
            color: #fca5a5;
            text-align: center;
        }

        .error.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }
    </style>
</head>
<body>
    <!-- Animated stars background -->
    <div class="stars" id="stars"></div>

    <div class="container">
        <div class="wizard-header">
            <div class="wizard-icon">🧙‍♂️</div>
            <h1>Magic Number Wizard</h1>
            <p class="subtitle">Discover the mystical properties of your number</p>
        </div>

        <div class="input-section">
            <label for="magicNumber">Enter Your Magic Number:</label>
            <div class="input-wrapper">
                <input type="text" id="magicNumber" class="magic-input" placeholder="Enter a number..." autofocus>
            </div>
            <button id="castSpell" onclick="castMagicSpell()">✨ Cast Spell ✨</button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Consulting the ancient scrolls...</p>
        </div>

        <div class="error" id="error"></div>

        <div class="result" id="result">
            <div class="result-title">🔮 Magical Properties Revealed 🔮</div>
            <div class="result-item">
                <span class="result-label">Magic Number:</span>
                <span class="result-value" id="displayNumber">-</span>
            </div>
            <div class="result-item">
                <span class="result-label">Even or Odd:</span>
                <span class="result-value" id="displayEven">-</span>
            </div>
            <div class="result-item">
                <span class="result-label">Squared Power:</span>
                <span class="result-value" id="displaySquared">-</span>
            </div>
            <div class="message" id="displayMessage">-</div>
        </div>
    </div>

    <script>
        // Create animated stars
        function createStars() {
            const starsContainer = document.getElementById('stars');
            const numberOfStars = 100;

            for (let i = 0; i < numberOfStars; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                starsContainer.appendChild(star);
            }
        }

        createStars();

        // Allow Enter key to submit
        document.getElementById('magicNumber').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                castMagicSpell();
            }
        });

        async function castMagicSpell() {
            const magicNumberInput = document.getElementById('magicNumber');
            const magicNumber = magicNumberInput.value;

            // Validate input
            if (!magicNumber || magicNumber.trim() === '') {
                showError('Please enter a magic number!');
                return;
            }

            // Hide previous results and errors
            document.getElementById('result').classList.remove('active');
            document.getElementById('error').classList.remove('active');
            
            // Show loading
            document.getElementById('loading').classList.add('active');
            document.getElementById('castSpell').disabled = true;

            try {
                // Make API call
                const apiUrl = `https://x53dombtm1.execute-api.us-east-2.amazonaws.com/demo/?magicNumber=${encodeURIComponent(magicNumber)}`;
                
                const response = await fetch(apiUrl, {
                    headers: {
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`API returned status ${response.status}`);
                }

                const data = await response.json();

                // Display results
                displayResults(data);

            } catch (error) {
                console.error('Error:', error);
                showError('The magic spell failed! Please try again. Error: ' + error.message);
            } finally {
                // Hide loading
                document.getElementById('loading').classList.remove('active');
                document.getElementById('castSpell').disabled = false;
            }
        }

        function displayResults(data) {
            document.getElementById('displayNumber').textContent = data.magicNumber;
            document.getElementById('displayEven').textContent = data.isEven ? '✓ Even' : '✗ Odd';
            document.getElementById('displaySquared').textContent = data.squared.toLocaleString();
            document.getElementById('displayMessage').textContent = data.message;

            document.getElementById('result').classList.add('active');
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.classList.add('active');
        }
    </script>
</body>
</html>
